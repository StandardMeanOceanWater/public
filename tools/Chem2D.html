<script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
<script>
let sd=null;

function go(n){document.getElementById('q').value=n;run();}

function setStatus(html,isErr){
  const s=document.getElementById('status');
  s.style.display='block';
  s.className='status'+(isErr?' err':'');
  s.innerHTML=html;
  document.getElementById('results').style.display='none';
}

function step(label,state){return`<span class="step ${state}">${label}</span>`;}

// === 配位化合物 SVG 示意圖（碎片化 SMILES，如 [Co(NH3)6]Cl3）===
const COORD_METAL_SYMBOLS=new Set(['Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','La','Ce','Pr','Nd','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Al','Ga','In','Sn','Sb']);

const COORD_ALKALI=new Set(['Li','Na','K','Rb','Cs','Mg','Ca','Sr','Ba']);

// 偵測碎片化 SMILES 是否含金屬（中心金屬＋鹼/鹼土金屬），含則改用 PubChem PNG 繪圖。
// 金屬清單以上方兩個 Set 為唯一來源，正則自動產生，避免同一份名單維護兩處。
// 依符號長度排序讓雙字母符號（如 Sc、Na）優先匹配；大小寫敏感符合 SMILES 元素符號規範。
const METAL_DETECT_RE=new RegExp('\\[(?:'+[...COORD_METAL_SYMBOLS,...COORD_ALKALI].sort((a,b)=>b.length-a.length).join('|')+')');
function smilesNeedsPubChem2D(smiles){
  if(!smiles||!smiles.includes('.')) return false;
  return METAL_DETECT_RE.test(smiles);
}

const EXPECTED_CN={'Co-3':6,'Co-2':6,'Fe-2':6,'Fe-3':6,'Cu-2':4,'Cu-1':2,'Ag-1':2,'Zn-2':4,'Ni-2':6,'Pt-2':4,'Pt-4':6,'Hg-2':4,'Cr-3':6,'Cr-2':6,'Al-3':4,'Mn-2':6,'Au-1':2,'Au-3':4,'Pd-2':4};

const GEOMETRY_TABLE={'Co-3-6':'octahedral','Co-2-6':'octahedral','Co-2-4':'tetrahedral','Fe-2-6':'octahedral','Fe-3-6':'octahedral','Cu-2-4':'square_planar','Cu-2-6':'octahedral','Cu-1-2':'linear','Ag-1-2':'linear','Zn-2-4':'tetrahedral','Zn-2-6':'octahedral','Ni-2-6':'octahedral','Ni-2-4':'square_planar','Pt-2-4':'square_planar','Pt-4-6':'octahedral','Hg-2-4':'tetrahedral','Hg-2-2':'linear','Cr-3-6':'octahedral','Cr-2-6':'octahedral','Al-3-4':'tetrahedral','Al-3-6':'octahedral','Mn-2-6':'octahedral','Au-1-2':'linear','Au-3-4':'square_planar','Pd-2-4':'square_planar'};

// 電荷數轉上標離子符號：+1→⁺、+2→²⁺、+3→³⁺、-1→⁻、-2→²⁻
function chargeSup(charge){
  const sup={'1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
  const n=Math.abs(charge);
  const digits=n>1?String(n).split('').map(d=>sup[d]||'').join(''):'';
  return digits+(charge>0?'\u207A':'\u207B');
}

function parseFragmentedSmiles(smiles){
  if(!smiles||!smiles.includes('.')) return null;
  const parts=smiles.split('.').filter(Boolean);
  let metal=null;
  const cationCounters=[],neutralFragments=[],anionicFragments=[],unknownFragments=[];
  for(const p of parts){
    const m=p.match(/^\[([A-Za-z][A-Za-z0-9]*)([+-]\d*)\]$/);
    if(m){
      const sym=m[1];
      let cs=m[2]; if(cs==='+'||cs==='-'||cs==='') cs=(cs||'+')+'1';
      const charge=parseInt(cs);
      if(COORD_ALKALI.has(sym)&&charge>0){ cationCounters.push({raw:p,symbol:sym+chargeSup(charge),charge}); }
      else if(COORD_METAL_SYMBOLS.has(sym)&&charge>0){
        if(!metal){ metal={symbol:sym,os:charge}; }
        else if(charge>metal.os){
          cationCounters.push({raw:`[${metal.symbol}+${metal.os}]`,symbol:metal.symbol+chargeSup(metal.os),charge:metal.os});
          metal={symbol:sym,os:charge};
        } else { cationCounters.push({raw:p,symbol:sym+chargeSup(charge),charge}); }
      }
      else if(charge<0){ anionicFragments.push({raw:p,name:sym+'\u207B',charge}); }
      else if(sym==='NH4'&&charge>0){ cationCounters.push({raw:p,symbol:'NH\u2084'+chargeSup(charge),charge}); }
      else { unknownFragments.push(p); }
      continue;
    }
    if(p==='N'){neutralFragments.push({raw:'N',name:'NH\u2083',charge:0});continue;}
    if(p==='O'){neutralFragments.push({raw:'O',name:'H\u2082O',charge:0});continue;}
    if(p==='P'){neutralFragments.push({raw:'P',name:'PH\u2083',charge:0});continue;}
    if(p==='S'){neutralFragments.push({raw:'S',name:'H\u2082S',charge:0});continue;}
    if(p==='C#N'||p==='N#C'||p==='[C-]#N'){anionicFragments.push({raw:p,name:'CN\u207B',charge:-1});continue;}
    if(p==='[OH-]'){anionicFragments.push({raw:p,name:'OH\u207B',charge:-1});continue;}
    if(p==='[O-][N+]([O-])=O'){anionicFragments.push({raw:p,name:'NO\u2083\u207B',charge:-1});continue;}
    unknownFragments.push(p);
  }
  if(!metal) return null;
  const expectedCn=EXPECTED_CN[`${metal.symbol}-${metal.os}`];
  if(!expectedCn) return {error:`No CN entry for ${metal.symbol}(+${metal.os})`};
  const ligands=[]; let slots=expectedCn;
  for(const n of neutralFragments){ if(slots>0){ligands.push(n);slots--;} }
  const anionicCounters=[];
  for(const a of anionicFragments){
    if(slots>0){ ligands.push(a); slots--; }
    else { anionicCounters.push(a); }
  }
  const allCounters=[...cationCounters, ...anionicCounters];
  const cn=ligands.length;
  const key=`${metal.symbol}-${metal.os}-${cn}`;
  const geometry=GEOMETRY_TABLE[key]||'unknown';
  return {
    metal:metal.symbol, oxidationState:metal.os,
    ligands:ligands.map(l=>l.name),
    counterIons:allCounters.map(c=>c.symbol||c.name),
    coordinationNumber:cn, expectedCn, predictedGeometry:geometry,
    unknownFragments,
  };
}

function getCoordinationSpecialCase({cid,smiles,iupac,formula}){
  const parsed=parseFragmentedSmiles(smiles);
  if(!parsed||parsed.error||parsed.predictedGeometry==='unknown') return null;
  if(parsed.unknownFragments.length>0) return null;
  const ligandCounts={};
  for(const l of parsed.ligands){ ligandCounts[l]=(ligandCounts[l]||0)+1; }
  // Build ligand tex: multi-char ligands need parens to disambiguate count
  //   NH3 × 6 → (NH3)6, Cl × 4 → Cl4, CN × 6 → (CN)6, OH × 4 → (OH)4
  const ligTex=Object.entries(ligandCounts).map(([l,n])=>{
    const cleaned=l.replace(/\u2083/g,'3').replace(/\u2082/g,'2').replace(/[\u207B\u207A]/g,'');
    const needsParens=cleaned.length>1;
    const count=n>1?n:'';
    return needsParens?`(${cleaned})${count}`:`${cleaned}${count}`;
  }).join('');
  const anionicLigandCount=parsed.ligands.filter(l=>l.endsWith('\u207B')).length;
  const complexCharge=parsed.oxidationState-anionicLigandCount;
  const showCharge=!parsed.counterIons.length;
  const chargeSuffix=showCharge?(complexCharge>0?(complexCharge===1?'+':`${complexCharge}+`):complexCharge<0?(complexCharge===-1?'-':`${Math.abs(complexCharge)}-`):''):'';
  const counterCounts={};
  for(const c of parsed.counterIons){ counterCounts[c]=(counterCounts[c]||0)+1; }
  const counterStr=Object.entries(counterCounts).map(([c,n])=>{
    return c.replace(/[\u00B9\u00B2\u00B3\u2070\u2074-\u2079\u207A\u207B-]/g,'')+(n>1?n:'');
  }).join('');
  const complexTex=`[${parsed.metal}${ligTex}]${chargeSuffix}`;
  let formulaTex;
  if(complexCharge>=0||!counterStr){ formulaTex=counterStr?`${complexTex}${counterStr}`:complexTex; }
  else { formulaTex=`${counterStr}${complexTex}`; }
  return {
    ...parsed,
    formulaTex,
    note:`Curated ${parsed.predictedGeometry} schematic — PubChem stores separated fragments.`,
  };
}

function renderCoordinationSvg(spec){
  const cx=318, cy=240;
  const geometry=spec.predictedGeometry;
  const ligands=spec.ligands;
  let positions=[];
  if(geometry==='linear'){
    positions=[{dx:-178,dy:0,lx:-205,ly:8,kind:'normal'},{dx:178,dy:0,lx:185,ly:8,kind:'normal'}];
  } else if(geometry==='square_planar'){
    positions=[
      {dx:0,dy:-115,lx:12,ly:-100,kind:'normal'},
      {dx:150,dy:0,lx:165,ly:8,kind:'normal'},
      {dx:0,dy:115,lx:12,ly:135,kind:'normal'},
      {dx:-150,dy:0,lx:-185,ly:8,kind:'normal'},
    ];
  } else if(geometry==='tetrahedral'){
    positions=[
      {dx:-150,dy:0,lx:-185,ly:8,kind:'normal'},
      {dx:150,dy:0,lx:165,ly:8,kind:'normal'},
      {dx:-80,dy:-115,lx:-115,ly:-130,kind:'dash'},
      {dx:80,dy:115,lx:95,ly:140,kind:'wedge'},
    ];
  } else if(geometry==='octahedral'){
    positions=[
      {dx:0,dy:-86,lx:12,ly:-92,kind:'normal'},
      {dx:0,dy:86,lx:12,ly:100,kind:'normal'},
      {dx:-140,dy:0,lx:-175,ly:8,kind:'normal'},
      {dx:140,dy:0,lx:155,ly:8,kind:'normal'},
      {dx:-83,dy:-68,lx:-115,ly:-80,kind:'dash'},
      {dx:83,dy:68,lx:95,ly:88,kind:'wedge'},
    ];
  } else {
    return `<div class="coord-figure"><svg viewBox="0 0 760 430"><text x="380" y="215" text-anchor="middle" font-size="20" fill="#666">Unsupported geometry: ${geometry}</text></svg></div>`;
  }
  positions=positions.slice(0,ligands.length);
  const bonds=positions.map(p=>{
    const x=cx+p.dx, y=cy+p.dy;
    if(p.kind==='dash') return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#6f7c8a" stroke-width="3" stroke-dasharray="7 7"/>`;
    if(p.kind==='wedge'){
      const angle=Math.atan2(p.dy,p.dx);
      const px=Math.cos(angle+Math.PI/2)*10, py=Math.sin(angle+Math.PI/2)*10;
      return `<polygon points="${cx},${cy} ${x-px},${y-py} ${x+px},${y+py}" fill="#6f7c8a" opacity=".9"/>`;
    }
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#6f7c8a" stroke-width="3"/>`;
  }).join('');
  const labels=positions.map((p,i)=>`<text x="${cx+p.lx}" y="${cy+p.ly}" class="ligand">${ligands[i]||'?'}</text>`).join('');
  const counterCounts={};
  for(const c of spec.counterIons){ counterCounts[c]=(counterCounts[c]||0)+1; }
  const counterEntries=Object.entries(counterCounts);
  const counterTexts=counterEntries.map(([c,n],i)=>`<text x="600" y="${185+i*40}" class="ion">${n>1?n+'\u00D7'+c:c}</text>`).join('');
  const formulaCaption=`${spec.metal}(${spec.ligands.join(',')}) ${spec.predictedGeometry} CN=${spec.coordinationNumber}`;
  return `<div class="coord-figure" role="img" aria-label="${geometry} coordination schematic">
    <svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg">
      <style>
        .metal{font:700 34px sans-serif;fill:#3b5068}
        .ligand{font:600 22px sans-serif;fill:#2367b0}
        .ion{font:600 22px sans-serif;fill:#25964a}
        .caption{font:14px sans-serif;fill:#667085}
      </style>
      <rect width="760" height="430" fill="transparent"/>
      ${bonds}
      <circle cx="${cx}" cy="${cy}" r="37" fill="#eef4ff" stroke="#3b5068" stroke-width="2"/>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" class="metal">${spec.metal}</text>
      ${labels}
      <text x="${cx-100}" y="${cy-130}" class="caption">${formulaCaption}</text>
      ${counterTexts}
      ${counterEntries.length?`<text x="595" y="155" class="caption">counter ions</text>`:''}
      <text x="40" y="404" class="caption">${spec.note}</text>
    </svg>
  </div>`;
}

// SMILES 含順反(cis/trans)立體標記（/ 或 \）時，SmilesDrawer 的版面常與課本/PubChem 相反，
// 改用 PubChem 標準 2D 描繪，確保順反丁烯二酸等幾何異構畫得正確。
function smilesHasCisTrans(smiles){ return /[\/\\]/.test(smiles||''); }

function render2DStructure(CID,smiles){
  const wrap=document.getElementById('canvas-wrap');
  const pngUrl='https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/'+CID+'/PNG?image_size=600x600';
  if(smilesNeedsPubChem2D(smiles)||smilesHasCisTrans(smiles)){
    wrap.innerHTML='<img src="'+pngUrl+'" style="max-width:100%;max-height:750px" alt="2D 結構式"/>';
    return;
  }
  if(!wrap.querySelector('#mc')){
    wrap.innerHTML='<canvas id="mc" width="1000" height="750"></canvas>';
  }
  if(!sd) sd=new SmilesDrawer.Drawer({width:1000,height:750,themes:{light:{C:'#1a1a1a',O:'#c0392b',N:'#2980b9',S:'#d4ac0d',P:'#8e44ad',F:'#16a085',Cl:'#27ae60',Br:'#a04000',I:'#6c3483',BACKGROUND:'transparent'}}});
  SmilesDrawer.parse(smiles,function(tree){
    sd.draw(tree,'mc','light',false);
  },function(){
    wrap.innerHTML='<img src="'+pngUrl+'" style="max-width:100%;max-height:750px" alt="2D 結構式"/>';
  });
}

async function pubchemFetch(name){
  const r=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(name)}/property/SMILES,MolecularFormula,MolecularWeight,IUPACName/JSON`);
  if(!r.ok) return null;
  const d=await r.json();
  return d.PropertyTable.Properties[0];
}

// === 蛋白質後備查詢：PubChem 查不到時改查 UniProt（actin / hemoglobin ...）===
async function uniprotSearch(name,limit=3){
  if(!name) return [];
  try{
    const url=`https://rest.uniprot.org/uniprotkb/search?query=protein_name:${encodeURIComponent(name)}&format=json&size=${limit}&fields=accession,id,protein_name,gene_names,organism_name,xref_pdb`;
    const r=await fetch(url);
    if(!r.ok) return [];
    const d=await r.json();
    const out=[];
    for(const e of (d.results||[])){
      const pd=e.proteinDescription||{};
      const fullName=(pd.recommendedName&&pd.recommendedName.fullName)?pd.recommendedName.fullName.value:'';
      const altNames=(pd.alternativeNames||[]).map(a=>(a.fullName||{}).value||'').filter(Boolean);
      const subNames=(pd.contains||[]).map(s=>((s.recommendedName||{}).fullName||{}).value||'').filter(Boolean);
      const allNames=[fullName].concat(altNames,subNames).filter(Boolean);
      const org=(e.organism||{}).scientificName||'?';
      const genes=(e.genes||[]).map(g=>[g.geneName&&g.geneName.value,g.locusName&&g.locusName.value].filter(Boolean).join(' / ')).filter(Boolean);
      const pdbIds=((e.uniProtKBCrossReferences||[]).filter(x=>x.database==='PDB')).map(x=>x.id);
      const reviewed=(e.entryType||'').includes('reviewed');
      out.push({
        accession:e.primaryAccession,
        name:allNames[0]||e.primaryAccession,
        altNames:allNames.slice(1,3),
        organism:org,
        gene:genes[0]||'',
        pdbIds,
        reviewed,
      });
    }
    return out;
  }catch(e){return [];}
}

function renderProteinCard(query,entries){
  const reviewedCount=entries.filter(e=>e.reviewed).length;
  let html=step('直接查詢','fail')+step('維基','fail')+step('翻譯查詢','done');
  html+=` <b style="color:var(--color-text-info)">「${query}」是蛋白質</b> — PubChem 僅收錄小分子，已改查 UniProt 蛋白質資料庫（${entries.length} 筆命中，${reviewedCount} 筆 Swiss-Prot 已人工審核）`;
  html+='<div style="margin-top:.75rem;display:flex;flex-direction:column;gap:.6rem">';
  for(const e of entries){
    const uniprotUrl=`https://www.uniprot.org/uniprot/${e.accession}`;
    const pdbUrl=e.pdbIds.length?`https://www.rcsb.org/structure/${e.pdbIds[0]}`:null;
    const pdbSearchUrl=`https://www.rcsb.org/search?query=%7B%22query%22%3A%7B%22type%22%3A%22terminal%22%2C%22service%22%3A%22full_text%22%2C%22parameters%22%3A%7B%22value%22%3A%22${encodeURIComponent(e.accession)}%22%7D%7D%2C%22return_type%22%3A%22entry%22%7D`;
    const alphafoldUrl=`https://alphafold.ebi.ac.uk/entry/${e.accession}`;
    const reviewedBadge=e.reviewed?'<span class="step done" style="margin-left:4px">Swiss-Prot</span>':'<span class="step" style="background:var(--color-background-secondary);color:var(--color-text-secondary)">TrEMBL</span>';
    html+=`<div class="card" style="padding:.7rem .9rem">`;
    html+=`<div style="font-size:15px;font-weight:600">${e.name} ${reviewedBadge}</div>`;
    if(e.altNames.length) html+=`<div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">別名：${e.altNames.join('、')}</div>`;
    html+=`<div style="font-size:13px;color:var(--color-text-secondary);margin-top:3px">${e.organism}${e.gene?' · 基因 '+e.gene:''}</div>`;
    html+=`<div style="font-size:13px;margin-top:5px">`;
    html+=`UniProt: <a href="${uniprotUrl}" target="_blank" style="color:var(--color-text-info)">${e.accession} <i class="ti ti-external-link" aria-hidden="true"></i></a>`;
    if(pdbUrl){
      html+=`<span style="margin:0 8px;color:var(--color-text-tertiary)">|</span> `;
      html+=`PDB 3D 結構 (${e.pdbIds.length}): <a href="${pdbUrl}" target="_blank" style="color:var(--color-text-info)">${e.pdbIds[0]} <i class="ti ti-external-link" aria-hidden="true"></i></a>`;
      if(e.pdbIds.length>1) html+=` <a href="${pdbSearchUrl}" target="_blank" style="color:var(--color-text-info);font-size:12px">看全部 ${e.pdbIds.length} 個 <i class="ti ti-external-link" aria-hidden="true"></i></a>`;
    }else{
      html+=`<span style="margin:0 8px;color:var(--color-text-tertiary)">|</span> <span style="color:var(--color-text-tertiary)">PDB：無實驗結構</span>`;
    }
    html+=`<span style="margin:0 8px;color:var(--color-text-tertiary)">|</span> `;
    html+=`<a href="${alphafoldUrl}" target="_blank" style="color:var(--color-text-info)">AlphaFold 預測結構 <i class="ti ti-external-link" aria-hidden="true"></i></a>`;
    html+=`</div></div>`;
  }
  html+=`</div>`;
  html+=`<div style="font-size:12px;color:var(--color-text-tertiary);margin-top:.5rem">註：蛋白質 3D 結構請至 PDB / AlphaFold 觀看；如需查詢此蛋白質的輔因子或受質（小分子），請以其英文名再查本工具。</div>`;
  return html;
}

async function pubchemFetchByCid(cid){
  const r=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/SMILES,MolecularFormula,MolecularWeight,IUPACName/JSON`);
  if(!r.ok) return null;
  const d=await r.json();
  const p=d.PropertyTable.Properties[0];
  p.CID=cid;
  return p;
}

const ZH_ALIASES={
  '苯':'benzene',
  '蔗糖':'sucrose',
  '阿斯匹靈':'aspirin',
  '阿司匹林':'aspirin',
  '咖啡因':'caffeine',
  '多巴胺':'dopamine',
  '膽固醇':'cholesterol',
  '血紅素':'heme',
  '血基質':'heme',
  '青黴素':'penicillin G',
  '順丁烯二酸':'maleic acid',
  '馬來酸':'maleic acid',
  '反丁烯二酸':'fumaric acid',
  '富馬酸':'fumaric acid',
  '乙二胺四乙酸':'edetic acid',
  'EDTA':'edetic acid',
  '三氯化六氨合鈷':'Hexamminecobalt(III) chloride',
  '無機黃鈷鹽':'Hexamminecobalt(III) chloride',
  '亞鐵氰化鉀':'potassium ferrocyanide',
  '亞鐵氰化鉀酸':'potassium ferrocyanide',
  '黃血鹽':'potassium ferrocyanide',
  '赤血鹽':'potassium ferricyanide',
  '鐵氰化鉀':'potassium ferricyanide'
};

const EN_ALIASES={
  'malay acid':'maleic acid',
  'malayacid':'maleic acid',
  'maley acid':'maleic acid',
  'sucose':'sucrose'
};

async function translateZhToEn(text){
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-TW|en`);
  if(!r.ok) return null;
  const d=await r.json();
  if(d.responseStatus===200){
    const t=d.responseData.translatedText;
    if(t&&t!==text) return t;
  }
  return null;
}

function normalizeLookupTitle(s){
  return (s||'').replace(/[\s_（）()，,。．·・-]/g,'').toLowerCase();
}

function isExactWikiTitle(query,title){
  return normalizeLookupTitle(query)===normalizeLookupTitle(title);
}

async function wikiZhLookup(query){
  const qr=await fetch('https://zh.wikipedia.org/w/api.php?action=query&redirects=1&prop=langlinks|pageprops&ppprop=wikibase_item&lllang=en&titles='+encodeURIComponent(query)+'&format=json&origin=*');
  if(!qr.ok) return null;
  const page=Object.values((await qr.json()).query.pages)[0];
  if(!page||page.missing) return null;
  const title=page.title||query;
  if(!isExactWikiTitle(query,title)) return null;

  const enTitle=page.langlinks&&page.langlinks[0]&&page.langlinks[0]['*'];
  const wikibase=page.pageprops&&page.pageprops.wikibase_item;
  if(wikibase){
    const wd=await fetch('https://www.wikidata.org/wiki/Special:EntityData/'+wikibase+'.json');
    if(wd.ok){
      const ent=(await wd.json()).entities[wikibase];
      const cid=ent&&ent.claims&&ent.claims.P662&&ent.claims.P662[0]&&ent.claims.P662[0].mainsnak.datavalue&&ent.claims.P662[0].mainsnak.datavalue.value;
      if(cid){
        const props=await pubchemFetchByCid(String(cid));
        if(props) return {props,wikiTitle:title,enTitle:enTitle||('CID '+cid),via:'wikidata'};
      }
    }
  }
  if(enTitle){
    const props=await pubchemFetch(enTitle);
    if(props) return {props,wikiTitle:title,enTitle, via:'wiki-en'};
  }
  return null;
}

async function run(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('results').style.display='none';

  setStatus(step('直接查詢 PubChem','running')+' 查詢中…');

  let props=null;
  let usedWiki=false;
  let translatedTo='';

  props=await pubchemFetch(q);

  if(!props){
    const alias=ZH_ALIASES[q]||EN_ALIASES[q.toLowerCase()];
    if(alias){
      setStatus(step('直接查詢 PubChem','fail')+step('常用名對照','running')+'「'+alias+'」…');
      props=await pubchemFetch(alias);
      if(props){translatedTo=alias;}
    }
  }

  if(!props){
    setStatus(step('直接查詢 PubChem','fail')+step('查詢維基百科','running')+' 搜尋中…');
    const wiki=await wikiZhLookup(q);
    if(wiki){
      props=wiki.props;
      usedWiki=true;
      translatedTo=wiki.enTitle;
      setStatus(step('直接查詢 PubChem','fail')+step('維基百科','done')+`「${wiki.wikiTitle}」→「${wiki.enTitle}」`+step('查詢 PubChem','done'));
    }
  }

  if(!props){
    setStatus(step('直接查詢 PubChem','fail')+(usedWiki?step('維基百科','fail'):'')+step('翻譯繁中→英文','running')+' 翻譯中…');
    const en=await translateZhToEn(q);
    if(en){
      translatedTo=en;
      setStatus(step('直接查詢 PubChem','fail')+step('維基百科','fail')+step('翻譯','done')+`「${en}」`+step('查詢 PubChem','running')+' 再次查詢…');
      props=await pubchemFetch(en);
    }
    if(!props){
      // Fallback: parallel-check UniProt (protein) + PubChem autocomplete (small molecule)
      // actin / hemoglobin / insulin → UniProt hits (proteins are out of PubChem's scope)
      // actin (no 'in' suffix) → PubChem autocomplete (actinomycin D, actinonin ...)
      const suggestBase=translatedTo||q;
      setStatus(step('直接查詢','fail')+step('維基','fail')+step('翻譯查詢','done')+`「${suggestBase}」<br>檢查是否為蛋白質（UniProt）與 PubChem 相近小分子…`);
      const [uniEntries, suggestions] = await Promise.all([
        uniprotSearch(suggestBase,3),
        (async ()=>{
          try{
            const ar=await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/autocomplete/compound/${encodeURIComponent(suggestBase)}?limit=8`);
            if(!ar.ok) return [];
            const ad=await ar.json();
            return (ad.dictionary_terms&&ad.dictionary_terms.compound)||[];
          }catch(e){return [];}
        })(),
      ]);

      // Prefer protein card if UniProt has reviewed hits, OR if there are no autocomplete suggestions
      // (avoids showing "actinomycin D" suggestions when the user clearly meant the protein actin)
      const hasReviewed=uniEntries.some(e=>e.reviewed);
      if(uniEntries.length && (hasReviewed || suggestions.length===0)){
        setStatus(renderProteinCard(suggestBase,uniEntries),true);
        return;
      }

      // Otherwise show "not found" + autocomplete suggestions (or generic hint)
      let msg=step('直接查詢','fail')+step('維基','fail')+step('翻譯查詢','fail')+' 查無結果';
      if(suggestBase) msg+=`（"${suggestBase}" 不在 PubChem 小分子資料庫）`;
      msg+='<br><span style="font-size:14px;color:var(--color-text-secondary)">可能原因：蛋白質 / 大分子 / 鹽類 / 晶體材料未收錄。';
      if(uniEntries.length){
        // UniProt had hits but unreviewed and small-molecule suggestions exist — show both
        msg+=`<br>UniProt 疑似蛋白質命中：`;
        for(const e of uniEntries.slice(0,2)){
          msg+=` <a href="https://www.uniprot.org/uniprot/${e.accession}" target="_blank" style="color:var(--color-text-info)">${e.name} (${e.accession}) <i class="ti ti-external-link" aria-hidden="true"></i></a>`;
        }
      }
      if(suggestions.length){
        msg+=`<br>PubChem 中名稱相近的小分子，可點選重查：</span><br>`;
        msg+=`<div style="margin-top:.5rem">`;
        for(const s of suggestions){
          msg+=`<span class="tag" style="margin:2px" onclick="go(${JSON.stringify(s)})">${s}</span>`;
        }
        msg+=`</div>`;
      }else{
        msg+='</span>';
      }
      // External database fallback — let user escalate to specialized databases
      // (protein: UniProt/PDB/AlphaFold already linked above if matched;
      //  crystal / material / coordination: COD / Materials Project / CSD)
      const extQ=encodeURIComponent(suggestBase||q);
      msg+=`<div style="margin-top:.85rem;padding:.7rem .9rem;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-secondary)">`;
      msg+=`<div style="font-size:14px;font-weight:600;margin-bottom:.4rem">進階查詢：本工具僅涵蓋 PubChem 小分子，若您要查的是以下類別，請至對應資料庫：</div>`;
      msg+=`<div style="font-size:13px;line-height:2">`;
      msg+=`<a href="https://www.crystallography.net/cod/search.html?text1=${extQ}&submit=Search" target="_blank" style="color:var(--color-text-info);margin-right:1rem">💎 COD (Crystallography Open Database) <i class="ti ti-external-link" aria-hidden="true"></i></a> <span style="color:var(--color-text-tertiary);font-size:12px">— 晶體 / 配位 / 礦物（免費）</span><br>`;
      msg+=`<a href="https://next-gen.materialsproject.org/search?q=${extQ}" target="_blank" style="color:var(--color-text-info);margin-right:1rem">🧱 Materials Project <i class="ti ti-external-link" aria-hidden="true"></i></a> <span style="color:var(--color-text-tertiary);font-size:12px">— 無機材料 / 固態（需註冊）</span><br>`;
      msg+=`<a href="https://www.ccdc.cam.ac.uk/structures/" target="_blank" style="color:var(--color-text-info);margin-right:1rem">🔬 CSD (CCDC Web Access) <i class="ti ti-external-link" aria-hidden="true"></i></a> <span style="color:var(--color-text-tertiary);font-size:12px">— 金屬有機 / 配位（需通過 captcha）</span><br>`;
      msg+=`<a href="https://www.uniprot.org/uniprotkb?query=${extQ}" target="_blank" style="color:var(--color-text-info);margin-right:1rem">🧬 UniProt <i class="ti ti-external-link" aria-hidden="true"></i></a> <span style="color:var(--color-text-tertiary);font-size:12px">— 蛋白質序列與註解</span><br>`;
      msg+=`<a href="https://www.rcsb.org/search?query=%7B%22query%22%3A%7B%22type%22%3A%22terminal%22%2C%22service%22%3A%22full_text%22%2C%22parameters%22%3A%7B%22value%22%3A%22${extQ}%22%7D%7D%2C%22return_type%22%3A%22entry%22%7D" target="_blank" style="color:var(--color-text-info);margin-right:1rem">📐 RCSB PDB <i class="ti ti-external-link" aria-hidden="true"></i></a> <span style="color:var(--color-text-tertiary);font-size:12px">— 蛋白質 / 核酸 3D 結構</span>`;
      msg+=`</div></div>`;
      setStatus(msg,true);
      return;
    }
  }

  // PubChem 已將 property 由 IsomericSMILES 更名為 SMILES（舊名保留為備援）
  const {CID,SMILES,IsomericSMILES,MolecularFormula:formula,MolecularWeight:mw,IUPACName:iupac}=props;
  const smiles=SMILES||IsomericSMILES||'';
  const coordSpecial=getCoordinationSpecialCase({cid:CID,smiles,iupac,formula});
  const pc3d=document.getElementById('pc3d');
  if(pc3d) pc3d.href='https://pubchem.ncbi.nlm.nih.gov/compound/'+CID+'#section=3D-Conformer';
  const enName=translatedTo||iupac||q;
  document.getElementById('molview-link').href='https://app.molview.com/?q=cid:'+CID;
  const ctLink=document.getElementById('chemtube3d-link');
  ctLink.href='https://www.chemtube3d.com/?s='+encodeURIComponent(enName);
  // Try to find the actual molecule page via WP REST API (CORS-friendly)
  fetch('https://www.chemtube3d.com/wp-json/wp/v2/search?_fields=url&search='+encodeURIComponent(enName)+'&per_page=1')
    .then(r=>r.ok?r.json():[])
    .then(data=>{if(data.length&&data[0].url)ctLink.href=data[0].url;})
    .catch(()=>{});

  document.getElementById('status').style.display='none';
  document.getElementById('results').style.display='block';

  // 配位特例：碎片化 SMILES 用 SVG 示意圖，其他走 SmilesDrawer / PubChem PNG
  if(coordSpecial){
    document.getElementById('canvas-wrap').innerHTML=renderCoordinationSvg(coordSpecial);
  } else {
    render2DStructure(CID,smiles);
  }

  // 2D-only mode: chemfig generation removed
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
</script>
