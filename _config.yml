# ============================================
# 網站基本資訊
# ============================================
title: "標準平均海水"         
description: "公開資料"
baseurl: ""                   

# ============================================
# 主題：官方 hacker（唯一預設黑底主題）
# ============================================
remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

# ============================================
# Collections：note 和 journal
# ============================================
collections:
  note:
    output: true
    permalink: /note/:path/
  journal:
    output: true
    permalink: /journal/:path/

# 讓 collection 的文章預設套用對應 layout
defaults:
  - scope:
      path: ""
      type: "note"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "post"

# ============================================
# 建置效能設定
# ============================================
# 本地預覽用 --incremental 才會生效，指令見下方說明
incremental: true

# 排除不需要被處理的檔案，加快建置速度
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.log"

# ============================================
# Markdown 設定
# ============================================
markdown: kramdown
highlighter: rouge
