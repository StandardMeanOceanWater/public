# ============================================
# 網站基本資訊
# ============================================
title: "標準平均海水"          
description: "公開資料"   
url: "https://standardmeanoceanwater.github.io"
baseurl: "/public"          

# ============================================
# 主題：官方 hacker（唯一預設黑底主題）
# ============================================
theme: jekyll-theme-hacker
plugins:
  - jekyll-seo-tag

# ============================================
# 建置效能設定
# ============================================
# 本地預覽用 --incremental 才會生效，指令見下方說明
incremental: true

# 排除不需要被處理的檔案，加快建置速度
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - "*.log"

# ============================================
# Markdown 設定
# ============================================
markdown: kramdown
highlighter: rouge
