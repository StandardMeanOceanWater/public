name: Build and Deploy Jekyll site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Auto-add front matter to .md files missing it
        run: |
          find . -name "*.md" \
            -not -path "./.git/*" \
            -not -path "./vendor/*" \
            -not -path "./_site/*" | while read -r file; do
            first_line=$(head -n 1 "$file")
            if [ "$first_line" != "---" ]; then
              echo "補 front matter: $file"
              tmpfile=$(mktemp)
              {
                echo "---"
                echo "layout: default"
                echo "---"
                echo ""
                cat "$file"
              } > "$tmpfile"
              mv "$tmpfile" "$file"
            fi
          done

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
